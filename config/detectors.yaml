# Thresholds and scoring weights for all detectors.
#
# TIME DELAY / GHOST ASSET delay-style detectors no longer use a fixed
# guideline day-count as their trigger. Measured against the real
# population (see docs/SCHEMA.md "Flag-rate recalibration"), the MPLADS
# guidelines themselves (45 days to sanction, 365 to complete) are missed
# by 28-69% of all real works - hitting the guideline is the norm in this
# system, not a deviation from it, so gating on it flagged most of the
# dataset. Each of these now gates on a PERCENTILE of its own real, current
# population instead (computed fresh every pipeline run - "the norm" is
# whatever the data actually shows this run, never a hardcoded number) -
# this is what "deviations from established norms" in the problem
# statement actually calls for, and it naturally yields a small, meaningful
# flag rate by construction. `guideline_days` is kept as informational
# context only (still shown in evidence for reference), not the trigger.
# confidence is "statistical" for these (peer-relative outlier), not "rule".

as_of_date: "2026-09-10"   # frozen — matches README snapshot date

detectors:
  STALLED_AT_SANCTION:
    tag: "TIME DELAY"
    confidence: statistical
    guideline_days: 45
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    guideline_source: >-
      MPLADS guideline: sanction expected within 45 days of recommendation.
      Flagged here for sitting in the slowest 10% of currently-unsanctioned
      recommendations, not merely for missing the 45-day guideline (69% of
      this population does).

  SANCTION_DELAY:
    tag: "TIME DELAY"
    confidence: statistical
    guideline_days: 45
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    guideline_source: >-
      MPLADS guideline: sanction expected within 45 days of recommendation.
      Flagged here for being in the slowest 10% of actual sanction delays,
      not merely for missing the 45-day guideline (68% of sanctioned works do).

  STALLED_AT_EXECUTION:
    tag: "TIME DELAY"
    confidence: statistical
    guideline_days: 365
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    guideline_source: >-
      MPLADS guideline: work expected complete within 1 year of sanction.
      Flagged here for sitting in the slowest 10% of currently-uncompleted
      sanctioned works, not merely for missing the 1-year guideline (45% do).

  EXECUTION_DELAY:
    tag: "TIME DELAY"
    confidence: statistical
    guideline_days: 365
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    guideline_source: >-
      MPLADS guideline: work expected complete within 1 year of sanction.
      Flagged here for being in the slowest 10% of actual completion times,
      not merely for missing the 1-year guideline (28% of completions do).

  TEMPORAL_SANCTION_BEFORE_RECOMMENDATION:
    tag: "DATA INTEGRITY"
    confidence: rule
    severity: high
    guideline_source: "logical constraint: SANCTION_DATE must not precede RECOMMENDATION_DATE"

  TEMPORAL_COMPLETION_BEFORE_SANCTION:
    tag: "DATA INTEGRITY"
    confidence: rule
    severity: high
    guideline_source: "logical constraint: ACTUAL_END_DATE must not precede SANCTION_DATE"

  TEMPORAL_PAYMENT_BEFORE_SANCTION:
    tag: "DATA INTEGRITY"
    confidence: rule
    severity: high
    guideline_source: "logical constraint: earliest EXPENDITURE_DATE must not precede SANCTION_DATE"

  GHOST_ASSET:
    tag: "GHOST ASSET"
    confidence: rule
    severity: high
    guideline_source: >-
      MPLADS record-keeping norm: a completed, paid work should have a supporting
      file attached. CAVEAT: presence of ATTACH_ID/FILE_STATUS only confirms some
      file was attached, not verified to be photographic completion evidence -
      no field in this dataset distinguishes file type.

  PAID_NOT_COMPLETE:
    tag: "GHOST ASSET"
    confidence: statistical
    guideline_days: 365
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    guideline_source: >-
      MPLADS guideline: work expected complete within 1 year of sanction.
      Flagged here for being in the slowest 10% of paid-but-uncompleted
      works, not merely for missing the 1-year guideline (55% do).

  STUCK_STATUS:
    tag: "TIME DELAY"
    confidence: statistical
    guideline_days: 730
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    early_stages: ["Time Estimation", "Pending for Sanction", "Physical Inspection", "Vendor Identification"]
    guideline_source: >-
      A work parked in an early, pre-execution WORK_STAGE for an unusually
      long time relative to its peers - distinct from STALLED_AT_SANCTION
      (any not-yet-sanctioned work) and STALLED_AT_EXECUTION (doesn't care
      which stage a sanctioned work is parked in). Flagged for sitting in the
      slowest 10% of this early-stage population, not a fixed day count.

  OVER_ALLOCATION:
    tag: "OVER ALLOCATION"
    confidence: rule
    severity: high
    guideline_source: >-
      MPLADS guideline: an MP's recommendations may not exceed their allocated
      limit for the tenure, matched by constituency + tenure. This is a
      hard compliance check against ALLOCATED_AMT, not a percentile judgement.

  STATUTORY_SC_ST_DEFICIT:
    tag: "STATUTORY COMPLIANCE"
    confidence: rule
    severity: high
    sc_target_pct: 15.0
    st_target_pct: 7.5
    min_evaluated_amount: 20000000  # ₹2 Cr minimum portfolio recommendations to evaluate compliance
    guideline_source: >-
      MPLADS Guideline Rule 2.5: at least 15% of annual MPLADS funds must be used
      for areas inhabited by Scheduled Caste (SC) population and 7.5% for Scheduled
      Tribe (ST) population. Flagged when an MP's portfolio fails to meet the statutory
      minimum allocation thresholds.

  COST_OUTLIER:
    tag: "COST OUTLIER"
    confidence: statistical
    peer_key: ["ACTIVITY_NAME_CLEAN", "STATE_NAME"]
    min_peers: 30
    modified_z_threshold: 3.5
    severity_z: [3.5, 5, 8]   # low/medium/high edges on modified z-score (positive/overrun side only)
    guideline_source: >-
      Robust (median + MAD) modified z-score of SANCTION_AMOUNT against peer
      works of the same cleaned activity type in the same state (n>=30 peers
      required, or the work is skipped - not enough peers to judge "unusual").
      Positive-direction only: the problem statement's concern is cost
      OVERRUNS, not unusually cheap works - a different and differently-
      actionable signal that flagging both directions conflated. Threshold
      3.5 is the standard modified-z outlier cutoff (Iglewicz & Hoaglin).
      A high cost is not evidence of wrongdoing on its own - it
      says a human should look at why this one differs from its peers.

  DUPLICATE_WORK:
    tag: "DUPLICATION"
    confidence: statistical
    min_description_length: 40   # chars - excludes bare category restatements like "table of kitchen"
    max_group_size: 3            # a real accidental duplicate is a pair (or small handful), not a
                                  # batch - this is what separates it from normal bulk procurement
                                  # (e.g. 22 identical benches bought in one order)
    block_keys: ["CONSTITUENCY_ID", "ACTIVITY_NAME_CLEAN"]
    guideline_source: >-
      Exact text match (after normalising case/whitespace) on WORK_DESCRIPTION
      within the same constituency and cleaned activity category, longer than
      a bare category restatement, confined to small groups (2-3 works) only.
      Went through two rejected designs before this one, hand-checking real
      hits at every step (see docs/SCHEMA.md): fuzzy similarity mostly caught
      an MP legitimately recommending the same type of work at different real
      villages via a shared template (the place name is too small a fraction
      of a long templated sentence to move a similarity score much); exact
      match alone then caught normal bulk procurement instead (many identical
      rows is the *correct* way to record buying many identical items). The
      group-size cap is what's left once both of those are ruled out - a real
      duplicate is a pair, not a batch. Flags every work in the small group -
      not proof any of them is fake, but a real description match a human
      should compare side by side.

  AGENCY_CONCENTRATION:
    tag: "AGENCY CONCENTRATION"
    confidence: statistical
    share_basis: value   # "value" or "works" - which share drives the gate + severity
    gate_percentile: 90
    bucket_percentiles: [90, 95, 99]
    min_agency_works: 5        # agency needs at least this many attributed works in the district
    min_district_agencies: 3   # district needs >=3 distinct attributed agencies, or "100% share" is trivial
    min_district_value: 5000000   # district's total attributed value (₹50L) must clear this floor
    guideline_source: >-
      An implementing agency's share of a district's total attributed
      (sanctioned, falling back to recommended) works/value among every
      agency active in that district, gated on a PERCENTILE of the current
      real distribution of eligible district-agency shares (recomputed
      every run, same philosophy as the TIME DELAY detectors above) - not a
      fixed share threshold. Only evaluated for districts with >=3 distinct
      attributed agencies and >=₹50L total attributed value, and only for
      agencies with >=5 attributed works in that district, so a tiny-sample
      district can't trivially flag its one agency at "100% share." The
      problem statement's own background names single-bid tender
      manipulation as a failure mode; this dataset has no bid-count field
      to check that literally, but agency concentration is the closest
      computable proxy for the same underlying concern.

queue:
  # 18th LS only - the reasoning that always excluded 17th LS from the
  # actionable queue (its MPs' terms ended in 2024; routing a finding to
  # "MP office" has no real recipient) didn't depend on Rajya Sabha and
  # still applies now that Rajya Sabha itself is out of scope entirely.
  # 17th LS stays fully analysed and visible via the scope toggle - just
  # not in the capped, actionable review queue.
  demo_scopes: ["18th Lok Sabha"]
  materiality_floor: 500000
  max_queue_size: 2000
  # Re-verify the achieved queue % after recalibration - see the pipeline's
  # printed summary, not a hardcoded expectation here anymore.

scoring:
  # priority_score = severity_weight + confidence_weight + exposure_weight * log10(max(financial_exposure,1))
  severity_weight:    {low: 1, medium: 2, high: 3}
  confidence_weight:  {rule: 1, statistical: 0.6, llm: 0.3}
  exposure_weight:    0.5
